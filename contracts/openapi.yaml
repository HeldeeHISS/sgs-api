    "/api/v1/unidades/{id}": {
      "patch": {
        "tags": [
          "unidades"
        ],
        "summary": "Atualizar unidade de saúde",
        "description": "006/R3, 011/R8.3. Aplica só os campos enviados e responde com a unidade e o `ETag` da\nversão nova, que o banco incrementa. Sem mudança, responde igual, sem alterar nem auditar.",
        "operationId": "atualizar_api_v1_unidades__id__patch",
        "security": [
          {
            "HTTPBearer": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "title": "Id"
            }
          },
          {
            "name": "If-Match",
            "in": "header",
            "required": false,
            "schema": {
              "anyOf": [
                {
                  "type": "string"
                },
                {
                  "type": "null"
                }
              ],
              "description": "A versão em mãos, como veio no `ETag` (ex.: `\"3\"`). Sem ele, 428.",
              "title": "If-Match"
            },
            "description": "A versão em mãos, como veio no `ETag` (ex.: `\"3\"`). Sem ele, 428."
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UnidadeUpdate"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UnidadeOut"
                }
              }
            }
          },
          "401": {
            "description": "Sem access token válido",
            "content": {
              "application/problem+json": {}
            }
          },
          "403": {
            "description": "Sem `unidade:update` no escopo da unidade, ou alteração de distrito, tipo ou CNES sem escopo global ou na área técnica (os campos vêm em `campos`)",
            "content": {
              "application/problem+json": {}
            }
          },
          "404": {
            "description": "A unidade não existe",
            "content": {
              "application/problem+json": {}
            }
          },
          "409": {
            "description": "Já existe unidade com o mesmo CNES ou o mesmo nome no distrito",
            "content": {
              "application/problem+json": {}
            }
          },
          "412": {
            "description": "A unidade mudou depois da versão informada em `If-Match`",
            "content": {
              "application/problem+json": {}
            }
          },
          "422": {
            "description": "Campos inválidos, ou tipo de unidade ou distrito inexistente",
            "content": {
              "application/problem+json": {}
            }
          },
          "428": {
            "description": "Falta o cabeçalho `If-Match`",
            "content": {
              "application/problem+json": {}
            }
          }
        }
      }
    },
