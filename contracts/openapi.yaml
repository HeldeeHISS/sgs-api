      "UnidadeCreate": {
        "properties": {
          "nome": {
            "type": "string",
            "maxLength": 200,
            "minLength": 1,
            "title": "Nome"
          },
          "cnes": {
            "anyOf": [
              {
                "type": "string",
                "pattern": "^[0-9]{7}$",
                "description": "Sete dígitos."
              },
              {
                "type": "null"
              }
            ],
            "title": "Cnes",
            "description": "Sem CNES, a unidade fica pendente."
          },
