            "type": "integer",
            "maximum": 32767.0,
            "minimum": 1.0,
            "title": "Tipo Unidade Id"
          },
          "distrito_id": {
            "type": "integer",
            "maximum": 32767.0,
            "minimum": 1.0,
            "title": "Distrito Id"
          },
          "cep": {
            "type": "string",
            "pattern": "^[0-9]{5}-?[0-9]{3}$",
            "title": "Cep",
            "description": "Oito dígitos, com ou sem hífen."
          },
          "endereco": {
            "type": "string",
            "maxLength": 200,
            "minLength": 1,
            "title": "Endereco"
          },
          "bairro": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 100,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ],
            "title": "Bairro"
          },
          "telefone": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 20,
                "minLength": 1,
                "pattern": "^[0-9()+\\- ]+$"
              },
              {
                "type": "null"
              }
            ],
            "title": "Telefone"
          },
          "nome_gestor": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 150,
                "minLength": 1
              },
              {
                "type": "null"
              }
            ],
            "title": "Nome Gestor"
          },
          "latitude": {
            "anyOf": [
              {
                "type": "number",
                "maximum": 90.0,
                "minimum": -90.0
              },
              {
                "type": "string",
                "pattern": "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,3}|(?=[\\d.]{1,10}0*$)\\d{0,3}\\.\\d{0,6}0*$)"
              },
              {
                "type": "null"
              }
            ],
            "title": "Latitude"
          },
          "longitude": {
            "anyOf": [
              {
                "type": "number",
                "maximum": 180.0,
                "minimum": -180.0
              },
              {
                "type": "string",
                "pattern": "^(?!^[-+.]*$)[+-]?0*(?:\\d{0,3}|(?=[\\d.]{1,10}0*$)\\d{0,3}\\.\\d{0,6}0*$)"
              },
              {
                "type": "null"
              }
            ],
            "title": "Longitude"
          },
          "status": {
            "type": "string",
            "enum": [
              "ativa",
              "inativa",
              "em_implantacao"
            ],
            "title": "Status"
          }
        },
        "additionalProperties": false,
        "type": "object",
        "required": [
          "nome",
          "tipo_unidade_id",
          "distrito_id",
          "cep",
          "endereco",
          "status"
        ],
        "title": "UnidadeCreate",
