    "/api/v1/unidades": {
      "post": {
        "tags": [
          "unidades"
        ],
        "summary": "Cadastrar unidade de saúde",
        "description": "006/R1. Responde com a unidade criada, o `Location` dela e o `ETag` da versão.",
        "operationId": "criar_api_v1_unidades_post",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UnidadeCreate"
              }
            }
          },
          "required": true
        },
        "responses": {
          "201": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UnidadeOut"
                }
              }
            }
          },
          "401": {
            "description": "Sem access token válido",
            "content": {
              "application/problem+json": {}
            }
          },
          "403": {
            "description": "Sem `unidade:create` na área técnica do tipo informado",
            "content": {
              "application/problem+json": {}
            }
          },
          "409": {
            "description": "Já existe unidade com o mesmo CNES ou o mesmo nome no distrito",
            "content": {
              "application/problem+json": {}
            }
          },
          "422": {
            "description": "Campos inválidos, ou tipo de unidade ou distrito inexistente",
            "content": {
              "application/problem+json": {}
            }
          }
        },
        "security": [
          {
            "HTTPBearer": []
          }
        ]
      }
    },
    "/api/v1/unidades/{id}/desativar": {
      "post": {
        "tags": [
          "unidades"
        ],
        "summary": "Desativar unidade de saúde",
        "description": "006/R4, 011/R6.1 a R6.4. Responde com a unidade inativa e o `ETag` da versão. Já inativa,\nresponde igual, sem alterar nada nem auditar.",
        "operationId": "desativar_api_v1_unidades__id__desativar_post",
        "security": [
          {
            "HTTPBearer": []
          }
        ],
        "parameters": [
          {
            "name": "id",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string",
              "format": "uuid",
              "title": "Id"
            }
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UnidadeDesativacao"
              }
            }
