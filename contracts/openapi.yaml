        },
        "responses": {
          "200": {
            "description": "Successful Response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/UnidadeOut"
                }
              }
            }
          },
          "401": {
            "description": "Sem access token válido",
            "content": {
              "application/problem+json": {}
            }
          },
          "403": {
            "description": "Sem `unidade:deactivate` no escopo da unidade",
            "content": {
              "application/problem+json": {}
            }
          },
          "404": {
            "description": "A unidade não existe",
            "content": {
              "application/problem+json": {}
            }
          },
          "422": {
            "description": "Motivo ausente ou inválido",
            "content": {
              "application/problem+json": {}
            }
          }
        }
      }
    },
